server {
  listen 80;
  server_tokens off;
  root /data/photos-public;
  autoindex off;
  location = /healthz { access_log off; return 200; }
  # Unfinished writes are .tmp-* files beside their target.
  location ~ /\. { return 404; }
  # Keys carry a hash of their bytes, so a cached copy can never go stale.
  location /products/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }
  # Every upload gets a new name, and an erased avatar must leave the Cloudflare edge within a day of its file being deleted (#474).
  location /avatars/ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff;
  }
  location / { return 404; }
}
