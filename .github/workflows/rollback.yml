name: Rollback

# GitHub only offers this manual trigger once the file is on the default branch (main).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of the earlier build to put back live
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    # Shares the deploy group, so tags never move while a deploy is running.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - uses: ./.github/actions/dokploy-deploy
        with:
          release-id: ${{ inputs.sha }}
          environment-tag: dev
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          compose-id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          app-url: ${{ vars.NEXT_PUBLIC_APP_URL }}
