name: CI

on:
  push:
    branches: [main, dev, 'ci/proof-**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request replaces its older run. Pushes to dev and main group by commit and
# never cancel, because each one builds and deploys its own images.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the jobs a pull request needs, at job level: a workflow-level `paths` would never start, which
  # leaves a required check pending forever, while a job skipped by its `if` reports as passed. Pushes run
  # everything, because strict mode is off and they build the images. A draft answers false here for the
  # jobs that wait for ready_for_review; the image smoke test has no draft skip. When this job fails,
  # the jobs below run anyway, so a broken filter can never pass a required check unseen.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && steps.filter.outputs.frontend) }}
      markdown: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && steps.filter.outputs.markdown) }}
      backend: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && steps.filter.outputs.backend) }}
      backup: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && steps.filter.outputs.backup) }}
      smoke: ${{ github.event_name != 'pull_request' || steps.filter.outputs.smoke }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            setup: &setup
              - .github/actions/setup-frontend/**
            frontend:
              - *workflow
              - *setup
              - frontend/**
              - contracts/**
            markdown:
              - *workflow
              - *setup
              - "**/*.md"
              - .prettierrc
              - .prettierignore
              - frontend/package.json
              - frontend/pnpm-lock.yaml
            backend:
              - *workflow
              - backend/**
              - contracts/**
            backup:
              - *workflow
              - backup/**
            # What the boot test builds: the backend image, the migrator stage and the compose files.
            smoke:
              - *workflow
              - backend/**
              - backup/**
              - docker-compose*.yml
              - .env.example
              - frontend/Dockerfile
              - frontend/.dockerignore
              - frontend/drizzle/**
              - frontend/scripts/migrate.mjs
              - frontend/package.json
              - frontend/pnpm-lock.yaml
              - frontend/pnpm-workspace.yaml

  frontend-build:
    name: Frontend build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy
          GOOGLE_CLIENT_SECRET: ci-dummy
          FACEBOOK_CLIENT_ID: ci-dummy
          FACEBOOK_CLIENT_SECRET: ci-dummy
          RESEND_API_KEY: re_ci_dummy
          EMAIL_FROM: ci@example.com
          CIJENE_API_URL: http://localhost:9999
          CIJENE_API_TOKEN: ci-dummy

      # A push is what seeds the cache: a pull request reads its base branch's copy but cannot write one
      # that anything else reads. This is why the build also runs on dev pushes.
      - if: github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

  # Each source change saves a new copy, and only the newest is ever read, so the older ones would fill
  # the repository's cache limit and evict what the next run needs. Separate, so the job that runs
  # project code never holds a token that can write to Actions.
  frontend-build-cache-prune:
    name: Prune old build caches
    needs: frontend-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the newest copy on this branch
        run: |
          stale=$(gh cache list --ref "$GITHUB_REF" --key next-build- --sort created_at --order desc --json id --jq '.[1:][].id')
          for id in $stale; do
            # A run for a newer push may have deleted it first.
            gh cache delete "$id" || echo "::notice::Cache $id is already gone."
          done

  frontend-test:
    name: Frontend tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - name: Unit tests
        run: pnpm test

  frontend-static:
    name: Frontend static checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Fallow audit diffs against the base branch, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - uses: ./.github/actions/setup-frontend
        with:
          save-cache: "true"

      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Dead code, duplication, complexity, import cycles and folder boundaries,
      # configured in frontend/.fallowrc.json. It fails only on findings this
      # change introduces, so the older backlog does not block anyone.
      - name: Fallow audit
        env:
          # A checkout has no upstream, so the base is named: the target branch
          # on a pull request, the previous tip on a push, or the parent when a
          # push creates the branch and `before` is all zeros.
          FALLOW_AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD~1' }}
        run: |
          pnpm exec fallow audit --quiet
          # Fallow exits 1 only on a "fail" verdict; new duplication alone is a
          # "warn", so the verdict itself is the gate.
          verdict=$(pnpm exec fallow audit --quiet --format json | jq -r .verdict)
          if [ "$verdict" != "pass" ]; then
            echo "::error::Fallow audit verdict is $verdict; see the report above."
            exit 1
          fi

      - name: Translation catalogs
        run: pnpm i18n:check

      - name: Format check
        run: pnpm exec prettier --check src

  # On its own because a docs-only pull request needs this and nothing else from the frontend.
  markdown:
    name: Markdown format
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.markdown == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - name: Format check (docs & root markdown)
        run: pnpm exec prettier --check --ignore-path ../.prettierignore "../README.md" "../AGENTS.md" "../CLAUDE.md" "../docs/**/*.md" "../.github/**/*.md" "../.agents/**/*.md"

  # The required check. A job may be skipped only when the filter turned it off, because a job that a
  # failed dependency skipped would otherwise count as passed. A new frontend job belongs in `needs` and
  # in the checks below, or its failure stays invisible here.
  frontend:
    name: Frontend checks
    needs: [changes, frontend-build, frontend-test, frontend-static, markdown]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every expected job to have passed
        env:
          FRONTEND_EXPECTED: ${{ needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true' }}
          MARKDOWN_EXPECTED: ${{ needs.changes.result != 'success' || needs.changes.outputs.markdown == 'true' }}
          BUILD: ${{ needs.frontend-build.result }}
          TEST: ${{ needs.frontend-test.result }}
          STATIC: ${{ needs.frontend-static.result }}
          MARKDOWN: ${{ needs.markdown.result }}
        run: |
          status=0
          check() {
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = false ]; }; then
              return
            fi
            echo "::error::$1 finished as $2."
            status=1
          }
          check "Frontend build" "$BUILD" "$FRONTEND_EXPECTED"
          check "Frontend tests" "$TEST" "$FRONTEND_EXPECTED"
          check "Frontend static checks" "$STATIC" "$FRONTEND_EXPECTED"
          check "Markdown format" "$MARKDOWN" "$MARKDOWN_EXPECTED"
          exit "$status"

  backend:
    name: Backend checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}

      - run: mvn -B verify

      # Pull requests only read: their caches are private to their merge ref, so nothing else could use them.
      - if: github.event_name == 'push' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

  # Boots the backend and migrator images the way Dokploy runs them. Only a boot catches a Dockerfile
  # that builds but leaves the app unable to start (a file the build stage never copied). No draft
  # skip, so a broken image shows up as soon as it is pushed.
  image-smoke:
    name: Image smoke test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.smoke == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .env.example holds a complete set of placeholder values, so no CI-only env file exists to drift.
      - name: Check the compose files
        run: |
          for file in docker-compose.yml docker-compose.prod.yml docker-compose.images.yml; do
            docker compose --env-file .env.example -f "$file" config -q
          done

      - name: Lint the Dockerfiles
        run: |
          docker build --check backend
          docker build --check --target migrator frontend
          docker build --check frontend
          docker build --check backup

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reads the cache the images job writes; the packages are public, so forks need no login.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          load: true
          tags: ghcr.io/offcrazyfreak/disscount-backend:smoke
          cache-from: type=registry,ref=ghcr.io/offcrazyfreak/disscount-backend:buildcache

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: migrator
          load: true
          tags: ghcr.io/offcrazyfreak/disscount-migrator:smoke
          cache-from: type=registry,ref=ghcr.io/offcrazyfreak/disscount-migrator:buildcache

      # --pull missing: the app images exist only locally, while Postgres and Alpine still come from the registry.
      - name: Boot the stack and wait for healthy
        run: |
          docker network create dokploy-network
          docker compose --env-file .env.example -f docker-compose.images.yml up --detach --wait --wait-timeout 180 --pull missing backend

      - name: Show container logs
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.images.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.images.yml down --volumes

  # Workflow files fail only when they run, often on the release or deploy path, so check them up front.
  actionlint:
    name: Workflow lint
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # The other images are proven by the frontend and backend checks; this one is only built on push otherwise.
  backup-image:
    name: Backup image
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result == 'failure' || needs.changes.outputs.backup == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke test
        run: |
          docker build -t backup-check backup
          docker run --rm --entrypoint sh backup-check -c 'rclone version && age --version && supercronic -version && pg_dump --version && bash -n /usr/local/bin/backup-job'

  images:
    name: Stub images
    needs: [frontend, backend, image-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "images would build here"
