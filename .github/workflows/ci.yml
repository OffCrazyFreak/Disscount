name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request replaces its older run. Pushes to dev and main group by commit and
# never cancel, because each one builds and deploys its own images.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    # Job level, so a required check on a draft reports as skipped instead of pending forever.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Fallow audit diffs against the base branch, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # Dead code, duplication, complexity, import cycles and folder boundaries,
      # configured in frontend/.fallowrc.json. It fails only on findings this
      # change introduces, so the older backlog does not block anyone.
      - name: Fallow audit
        env:
          # A checkout has no upstream, so the base is named: the target branch
          # on a pull request, the previous tip on a push, or the parent when a
          # push creates the branch and `before` is all zeros.
          FALLOW_AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD~1' }}
        run: |
          pnpm exec fallow audit --quiet
          # Fallow exits 1 only on a "fail" verdict; new duplication alone is a
          # "warn", so the verdict itself is the gate.
          verdict=$(pnpm exec fallow audit --quiet --format json | jq -r .verdict)
          if [ "$verdict" != "pass" ]; then
            echo "::error::Fallow audit verdict is $verdict; see the report above."
            exit 1
          fi

      - name: Translation catalogs
        run: pnpm i18n:check

      - name: Format check
        run: pnpm exec prettier --check src

      - name: Format check (docs & root markdown)
        run: pnpm exec prettier --check --ignore-path ../.prettierignore "../README.md" "../AGENTS.md" "../CLAUDE.md" "../docs/**/*.md" "../.github/**/*.md" "../.agents/**/*.md"

      # On a dev push the image build compiles the same code with the real values.
      - name: Production build
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy
          GOOGLE_CLIENT_SECRET: ci-dummy
          FACEBOOK_CLIENT_ID: ci-dummy
          FACEBOOK_CLIENT_SECRET: ci-dummy
          RESEND_API_KEY: re_ci_dummy
          EMAIL_FROM: ci@example.com
          CIJENE_API_URL: http://localhost:9999
          CIJENE_API_TOKEN: ci-dummy

  backend:
    name: Backend checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B verify

  # Workflow files fail only when they run, often on the release or deploy path, so check them up front.
  actionlint:
    name: Workflow lint
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # The other images are proven by the frontend and backend checks; this one is only built on push otherwise.
  backup-image:
    name: Backup image
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke test
        run: |
          docker build -t backup-check backup
          docker run --rm --entrypoint sh backup-check -c 'rclone version && age --version && supercronic -version && pg_dump --version && bash -n /usr/local/bin/backup-job'

  images:
    name: Image (${{ matrix.image }})
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Reads the dev values without recording a deployment; the deploy job records it.
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      packages: write
    # No cancelling: a later push's run could finish its checks first, and an older run starting
    # its builds afterwards would cancel the newer images. Each commit builds its own sha- tags.
    strategy:
      matrix:
        # The dokploy-deploy action moves the dev tag for exactly these images.
        include:
          - image: frontend
            context: frontend
            target: runner
          - image: migrator
            context: frontend
            target: migrator
          - image: backend
            context: backend
            target: runtime
          - image: backup
            context: backup
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/offcrazyfreak/disscount-${{ matrix.image }}
          # The moving dev tag is set by the deploy job, once every image exists.
          tags: type=sha,format=long

      # Only the frontend stages read these; the other images ignore them.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/offcrazyfreak/disscount-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/offcrazyfreak/disscount-${{ matrix.image }}:buildcache,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ vars.SENTRY_ENVIRONMENT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  # Runs before the deploy job queues, because a stale deploy waiting in the group would replace
  # the newer pending one and then have nothing to do.
  freshness:
    name: Still the dev tip
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      is-tip: ${{ steps.tip.outputs.is-tip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - id: tip
        uses: ./.github/actions/dev-tip
        with:
          release-id: ${{ github.sha }}
          token: ${{ github.token }}

  deploy:
    name: Deploy (dev)
    needs: [images, freshness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.freshness.outputs.is-tip == 'true'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    permissions:
      contents: read
      packages: write
    # A deploy in flight always finishes; a newer one waits behind it.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      # Checked again inside the lock: re-running this job reuses the freshness job's old answer.
      - id: tip
        uses: ./.github/actions/dev-tip
        with:
          release-id: ${{ github.sha }}
          token: ${{ github.token }}

      - if: steps.tip.outputs.is-tip == 'true'
        uses: ./.github/actions/dokploy-deploy
        with:
          release-id: ${{ github.sha }}
          environment-tag: dev
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          compose-id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          app-url: ${{ vars.NEXT_PUBLIC_APP_URL }}
