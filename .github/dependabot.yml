version: 2
updates:
  # Frontend (Next.js, pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend (Spring Boot, Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # springdoc tracks the Spring Boot line it was built against, so Boot 3.1.x
      # pairs with 2.2.x only. Bounded so 2.2.x security fixes still reach the
      # publicly exposed swagger-ui. Drop this once the Boot 4 migration lands.
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        versions: [">=2.3.0"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
