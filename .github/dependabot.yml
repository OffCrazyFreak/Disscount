version: 2
updates:
  # Frontend (Next.js, pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # react-scan 0.5.6+ ships a bundle that does a named import of "version"
      # from react-grab/package.json. Webpack treats JSON modules as
      # default-exporting only, so the import cannot be linked and the build
      # fails (aidenybai/react-scan#467). 0.5.x also floats react-grab and
      # react-doctor on the "latest" tag, so a fresh resolution can pull an
      # unreviewed version. Bounded so 0.4.x patches still come through.
      - dependency-name: "react-scan"
        versions: [">=0.5.0"]

  # Backend (Spring Boot, Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # springdoc tracks the Spring Boot line it was built against, so Boot 3.1.x
      # pairs with 2.2.x only. Bounded so 2.2.x security fixes still reach the
      # publicly exposed swagger-ui. Drop this once the Boot 4 migration lands.
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        versions: [">=2.3.0"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
