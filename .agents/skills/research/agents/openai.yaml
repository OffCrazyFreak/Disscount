interface:
  display_name: "Research"
  short_description: "Official docs, peer apps and practitioners before a decision"
  default_prompt: "Use $research: name the size, read Context7 and the official docs for the installed versions, compare apps that solve the same problem and what practitioners say, then recommend an approach and ask the open questions before implementation."

dependencies:
  tools:
    - type: "mcp"
      value: "context7"
      description: "Context7 MCP, current documentation for libraries and services"
      transport: "streamable_http"
      url: "https://mcp.context7.com/mcp"
