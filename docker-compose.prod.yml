# Production stack for Dokploy. Differs from docker-compose.yml (local) by:
#  - no container_name (Dokploy/Compose manages naming)
#  - no published host ports (Traefik handles ingress to the frontend)
#  - frontend joins the EXTERNAL `dokploy-network` so Traefik can route to it;
#    db / backend / migrate stay on the private `internal` network only
# All values come from Dokploy's Environment settings (production URLs + secrets).

x-frontend-build: &frontend-build
  context: ./frontend
  args:
    NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}

services:
  db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot Flyway migration of the backend tables (backend/src/main/resources/db/migration); Hibernate only checks them.
  flyway:
    build:
      context: ./backend
      target: flyway
    restart: "no"
    # The migrator login, which owns every table (db/database-roles.sql); blank falls back to the database owner.
    environment:
      FLYWAY_URL: ${SPRING_DATASOURCE_URL}
      FLYWAY_USER: ${MIGRATOR_DB_USERNAME:-${POSTGRES_USER}}
      FLYWAY_PASSWORD: ${MIGRATOR_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  # One-shot drizzle migration (better-auth tables).
  migrate:
    build:
      <<: *frontend-build
      target: build
    restart: "no"
    command: ["pnpm", "exec", "drizzle-kit", "migrate"]
    # The migrator login, not DATABASE_URL's Next.js login; blank falls back to the database owner. The URL here holds no
    # login, so an older migrator image, which requires DATABASE_URL, also signs in through PGUSER and PGPASSWORD.
    environment:
      DATABASE_URL: postgresql://db:5432/${POSTGRES_DB}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${MIGRATOR_DB_USERNAME:-${POSTGRES_USER}}
      PGPASSWORD: ${MIGRATOR_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
      # Flyway refuses to start on a new database that already holds tables, so it runs before drizzle adds them.
      flyway:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    # The image sizes its heap from this limit; without one it would take 60% of the host.
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      BETTER_AUTH_JWKS_URI: ${BETTER_AUTH_JWKS_URI}
      BETTER_AUTH_ISSUER: ${BETTER_AUTH_ISSUER}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      # Verbose SDK init/transport logging for debugging; leave unset normally
      SENTRY_DEBUG: ${SENTRY_DEBUG:-false}
      # The image hostname that serves public product photos; blank switches them off.
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Photo folders on the two photo volumes; blank switches those photos off (docs/PRODUCT-IMAGES.md).
      PHOTO_DIR: ${PHOTO_DIR:-}
      PUBLIC_PHOTO_DIR: ${PUBLIC_PHOTO_DIR:-}
    volumes:
      - photos-private:/data/photos-private
      - photos-public:/data/photos-public
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # The backend reads better-auth columns natively, so it must not start before their migration.
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      photo-folders:
        condition: service_completed_successfully

  # The backend never creates its top folders, so a forgotten volume leaves a store off instead of
  # writing into the container layer. Created here, owned by the backend's uid 1001.
  photo-folders:
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    restart: "no"
    network_mode: none
    volumes:
      - photos-private:/data/photos-private
      - photos-public:/data/photos-public
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/photos-private/cards /data/photos-private/product-originals /data/photos-public/products &&
        chown 1001:999 /data/photos-private /data/photos-private/cards /data/photos-private/product-originals /data/photos-public /data/photos-public/products &&
        chmod 700 /data/photos-private /data/photos-private/cards /data/photos-private/product-originals &&
        chmod 755 /data/photos-public /data/photos-public/products

  # Serves the public product photos on the image hostname (R2_PUBLIC_URL); read-only.
  images:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    volumes:
      - photos-public:/data/photos-public:ro
    configs:
      - source: images_nginx
        target: /etc/nginx/conf.d/default.conf
    expose:
      - "80"
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      photo-folders:
        condition: service_completed_successfully

  frontend:
    build:
      <<: *frontend-build
      target: runner
    restart: unless-stopped
    environment:
      # Runtime secrets (server-only)
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      CIJENE_API_URL: ${CIJENE_API_URL}
      CIJENE_API_TOKEN: ${CIJENE_API_TOKEN}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      # NEXT_PUBLIC_* also read server-side at runtime
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    expose:
      - "3000"
    networks: [internal, dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  pgdata:
  photos-private:
  photos-public:

configs:
  # No $ variables in here: Compose would interpolate them.
  images_nginx:
    content: |
      server {
        listen 80;
        server_tokens off;
        root /data/photos-public;
        autoindex off;
        location = /healthz { access_log off; return 200; }
        # Unfinished writes are .tmp-* files beside their target.
        location ~ /\. { return 404; }
        # Keys carry a hash of their bytes, so a cached copy can never go stale.
        location /products/ {
          add_header Cache-Control "public, max-age=31536000, immutable";
          add_header X-Content-Type-Options nosniff;
        }
        location / { return 404; }
      }
