# Departments and everyday categories for the product catalogue, read at every import (CatalogTaxonomy).
#
# Departments are the six groups of the price display rules (Pravilnik o isticanju bazne cijene, NN 132/2026),
# which is why most chains file products under them. chainCategories lists each chain's spelling; matching
# ignores case and accents. A chain category not listed here ("Ostalo", Tommy's "Neprehrana") casts no vote.
#
# Categories are tried top to bottom and the first match wins, so narrow ones come before broad ones.
#   department      where the category belongs; also the product's department when no chain says
#   alsoIn          other departments a chain may file it under; a product filed elsewhere never matches
#   chainCategories finer chain groups (Roto, Žabac) that hold only this category; exclude still applies
#   include         name terms, any one is enough
#   exclude         name terms that rule the category out
# Terms are words in order. word* matches any word starting with it (mlijek* takes mlijeko, mlijeka),
# a leading ^ means the term must open the name, where chains write the product type, and
# phrases joined by & must all appear in the name, in any order.

