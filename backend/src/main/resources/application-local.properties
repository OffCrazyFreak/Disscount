# Not defaults in application.properties, so production startup fails explicitly if BETTER_AUTH_JWKS_URI or BETTER_AUTH_ISSUER are missing.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:3000/api/auth/jwks
better.auth.issuer=http://localhost:3000

# Locally the backend migrates its own tables on start, so start it before the frontend's drizzle migration on a new database.
spring.flyway.enabled=true
