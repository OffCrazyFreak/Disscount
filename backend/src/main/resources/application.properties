springdoc.swagger-ui.path=/api-docs
# The API description and Swagger UI stay off on dev and production; the local profile turns them on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway owns the backend tables (src/main/resources/db/migration); Hibernate only checks they fit the entities.
spring.jpa.hibernate.ddl-auto=validate
# The flyway job migrates before the backend starts, so the runtime never alters tables (docs/INFRASTRUCTURE.md, Flyway).
spring.flyway.enabled=false
spring.jpa.show-sql=false
# Services return finished DTOs, so no lazy read may reach the controller or the JSON writer outside a transaction.
spring.jpa.open-in-view=false

# A larger size from the client is cut down to this, so one request cannot read a whole table.
spring.data.web.pageable.max-page-size=100

# No inline default: the app refuses to start without BETTER_AUTH_JWKS_URI and BETTER_AUTH_ISSUER in production.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${BETTER_AUTH_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
better.auth.issuer=${BETTER_AUTH_ISSUER}

# show-details=never so the public /actuator/health never leaks DB or internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Sentry error tracking - DSN + environment from env. Empty DSN disables Sentry (local-safe).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.traces-sample-rate=0.1
sentry.send-default-pii=false
# A client hanging up mid-response (a killed healthcheck probe, a closed tab) is not a server fault
sentry.ignored-exceptions-for-type=org.apache.catalina.connector.ClientAbortException
# The 500 handler and Spring's @Scheduled and @Async error handlers only log, so the logback appender is what reports them
sentry.logging.minimum-event-level=error
# Hibernate's SQL error logs quote the failing row, so this keeps row values, and every handled 409, out of Sentry and the log.
logging.level.org.hibernate.orm.jdbc.error=OFF
# Drops that Detail line from driver messages too, so a 500's exception text carries no row values either.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Verbose SDK init/transport logging for debugging init problems; off by default
sentry.debug=${SENTRY_DEBUG:false}

# Croatian when the header is missing or names another language; without the fallback switch a missing key would follow the JVM locale.
spring.web.locale=hr
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# A blank folder switches all its stores off; a missing subfolder inside switches only that store off.
photos.private-dir=${PHOTO_DIR:}
photos.public-dir=${PUBLIC_PHOTO_DIR:}
# The image hostname that serves public-dir; blank switches product photos off.
photos.public-url=${R2_PUBLIC_URL:}

# The weekly photo import streams for minutes, and Spring's single default thread would hold back card purges and photo copying.
spring.task.scheduling.pool.size=4

# One photo part is at most 512 KB; a request carries a full image plus its thumbnail.
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=1100KB
