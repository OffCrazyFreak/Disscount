# Custom path for Swagger UI
springdoc.swagger-ui.path=/api-docs

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

##JPA Config
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server - validates JWTs issued by better-auth (Next.js)
# No inline default: app refuses to start without BETTER_AUTH_JWKS_URI + BETTER_AUTH_ISSUER in production.
# Local defaults live in application-local.properties (activate with --spring.profiles.active=local).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${BETTER_AUTH_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
better.auth.issuer=${BETTER_AUTH_ISSUER}

# Security
spring.security.require-ssl=false

# Actuator - expose only the health endpoint (used by the Docker healthcheck).
# show-details=never so the public /actuator/health never leaks DB/internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Sentry error tracking - DSN + environment from env. Empty DSN disables Sentry (local-safe).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.traces-sample-rate=0.1
sentry.send-default-pii=false
# A client hanging up mid-response (a killed healthcheck probe, a closed tab) is not a server fault
sentry.ignored-exceptions-for-type=org.apache.catalina.connector.ClientAbortException
# Verbose SDK init/transport logging for debugging init problems; off by default
sentry.debug=${SENTRY_DEBUG:false}

# i18n: error messages follow the request's Accept-Language (hr, en, it, sl, de),
# Croatian when the header is missing or names another language. Without the fallback
# switch a missing key would follow the server's own JVM locale instead.
spring.web.locale=hr
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Cloudflare R2 card photos. Any blank value disables photos (uploads answer 503).
r2.endpoint=${R2_ENDPOINT:}
r2.bucket=${R2_BUCKET:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}

# One photo part is at most 512 KB; a request carries a full image plus its thumbnail.
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=1100KB
