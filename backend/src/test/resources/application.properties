# Tests run on H2 and never reach out of the module. Dummy values satisfy the placeholders main requires.
spring.datasource.url=jdbc:h2:mem:disscount;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Same schema as main; create-drop makes the app schema on H2 too.
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# The migrations are PostgreSQL SQL; tests on Postgres turn Flyway on with @MigratedPostgres.
spring.flyway.enabled=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:3000/api/auth/jwks
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
better.auth.issuer=http://localhost:3000

sentry.dsn=
photos.private-dir=
photos.public-dir=
photos.public-url=
product-images.jobs.enabled=false

# Same locale setup as main, so tests assert the Croatian default.
spring.web.locale=hr
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Same Swagger UI path as main, so tests cover the URL the docs point at. Springdoc stays on here, unlike main,
# because ApiContractTest builds contracts/backend-api.json from /v3/api-docs.
springdoc.swagger-ui.path=/api-docs

# Same as main, so a lazy read outside a transaction and an oversized page fail here first.
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
