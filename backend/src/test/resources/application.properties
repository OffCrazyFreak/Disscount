# Tests run on H2 and never reach out of the module. Dummy values satisfy the placeholders main requires.
spring.datasource.url=jdbc:h2:mem:disscount;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:3000/api/auth/jwks
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
better.auth.issuer=http://localhost:3000

sentry.dsn=
r2.endpoint=
r2.bucket=
r2.access-key-id=
r2.secret-access-key=

# Same locale setup as main, so tests assert the Croatian default.
spring.web.locale=hr
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
