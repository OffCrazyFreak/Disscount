allowBuilds:
  # Native binaries these packages cannot work without
  sharp: true
  esbuild: true
  unrs-resolver: true
  # Downloads the CLI used to upload source maps during a release build
  "@sentry/cli": true
  # Postinstall only prints a funding notice
  core-js: false
  # next-intl's message extraction only, which we don't use; both ship prebuilt binaries
  "@parcel/watcher": false
  "@swc/core": false

# Browser-compatibility data tables that republish almost daily. Without this they
# never clear pnpm's 24h minimumReleaseAge gate, so every rebased PR stays red.
# The guard stays active for every other package.
minimumReleaseAgeExclude:
  - electron-to-chromium
  - caniuse-lite
  - baseline-browser-mapping
  # Next.js 16.4.5 security release, inside the gate: GHSA-pc58-hwjq-p385, GHSA-7qx7-33qx-rqx2, GHSA-f3mh-rxg3-f5g2, GHSA-mfr8-8qww-v76h, GHSA-vc7v-qv4w-wrv8, GHSA-vvgp-ww4w-46vf, GHSA-rhh4-g77r-r9qj
  - next@16.4.5
  - eslint-config-next@16.4.5
  - "@next/env@16.4.5"
  - "@next/eslint-plugin-next@16.4.5"
  - "@next/swc-darwin-arm64@16.4.5"
  - "@next/swc-darwin-x64@16.4.5"
  - "@next/swc-linux-arm64-gnu@16.4.5"
  - "@next/swc-linux-arm64-musl@16.4.5"
  - "@next/swc-linux-x64-gnu@16.4.5"
  - "@next/swc-linux-x64-musl@16.4.5"
  - "@next/swc-win32-arm64-msvc@16.4.5"
  - "@next/swc-win32-x64-msvc@16.4.5"

# Force patched versions of vulnerable transitive deps (Dependabot #1-3, #13-14).
# Range selectors bump only the vulnerable copies; already-safe copies stay put.
overrides:
  "shell-quote@<1.8.5": "^1.8.5"
  "postcss@<8.5.10": "^8.5.10"
  "esbuild@<0.25.0": "^0.25.0"
  "sharp@<0.35.0": "^0.35.3"
  "fast-uri@<3.1.4": "^3.1.4"
